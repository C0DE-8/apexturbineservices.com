<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#082f56" />
    <meta name="robots" content="noindex, follow" />
    <title>Page Not Found | Apex Turbine Services</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; color: #fff; background: radial-gradient(ellipse at 78% 42%, rgba(26,112,171,.19), transparent 37%), linear-gradient(135deg,#071f38,#0a365d); }
      main { min-height: 100vh; display: flex; flex-direction: column; padding: clamp(22px,5vw,64px); }
      .logo { display: block; width: clamp(160px,20vw,230px); padding: 8px; border-radius: 4px; background: #fff; }
      .logo img { display: block; width: 100%; }
      .content { width: min(660px,100%); margin: auto; padding: 60px 0; }
      .code { display: block; color: #78b9e9; font-size: clamp(86px,18vw,156px); line-height: .85; letter-spacing: -.08em; font-weight: 800; }
      .label { color: #abd2ef; margin: 27px 0 8px; font-size: 11px; font-weight: bold; letter-spacing: .08em; text-transform: uppercase; }
      h1 { font-size: clamp(34px,6vw,56px); line-height: 1.05; letter-spacing: -.04em; margin: 0 0 14px; }
      .copy { max-width: 475px; color: #d0deea; font-size: 15px; line-height: 1.65; margin: 0 0 24px; }
      .button { display: inline-flex; gap: 14px; align-items: center; padding: 13px 17px; border: 1px solid #0876d5; border-radius: 5px; background: #0876d5; color: #fff; text-decoration: none; font-size: 13px; font-weight: bold; }
      footer { border-top: 1px solid rgba(255,255,255,.2); padding-top: 15px; color: #c5d6e5; font-size: 11px; }
      @media (max-width: 480px) { .content { margin: 32px 0 auto; }.copy { font-size: 14px; }footer { line-height: 1.6; } }
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/" aria-label="Apex Turbine Services home"><img src="/apex-logo.png" alt="Apex Turbine Services" /></a>
      <section class="content">
        <span class="code">404</span>
        <p class="label">Page not found</p>
        <h1>This page is off the grid.</h1>
        <p class="copy">The address may be incorrect, or the page may have moved. Head back to Apex Turbine Services to find what you need.</p>
        <a class="button" href="/">Back to home <span aria-hidden="true">→</span></a>
      </section>
      <footer>Apex Turbine Services · Engineering today. Powering tomorrow.</footer>
    </main>
  </body>
</html>
